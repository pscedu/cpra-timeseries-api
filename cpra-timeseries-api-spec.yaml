openapi: 3.0.0
info:
  title: CPRA Time Series API
  description: The CPRA Time-Series API returns data from the PDD for a set of predetermined tables. Any parameters listed for a particular route are also returned on the response for that route (excluding type and token).
  version: 1.0.0
  license:
    name: MIT License
servers:
  - url: "https://api.mpdap.coastal.la.gov"
components:
  parameters:
    TypeParameter:
      in: query
      name: type
      schema:
        type: string
        enum: [csv, json]
      description: Allows you to get response as CSV or JSON
    TokenParameter:
      in: query
      name: token
      schema:
        type: string
      description: Pass your authentication token here
    ScenarioNameParameter:
      in: query
      name: scenario_name
      schema:
        type: string
    ModelGroupNameParameter:
      in: query
      name: model_group_name
      schema:
        type: string
    GeographyParameter:
      in: query
      name: geography
      schema:
        type: string
    ElapsedYearParameter:
      in: query
      name: elapsed_year
      schema:
        type: string
    PumpingIDParameter:
      in: query
      name: pumping_id
      schema:
        type: string
    FragilityScenarioParameter:
      in: query
      name: fragility_scenario
      schema:
        type: string
    AssetTypeParameter:
      in: query
      name: asset_type
      schema:
        type: string
    ParticipationRateParameter:
      in: query
      name: participation_rate
      schema:
        type: string
    NSProjectIDParameter:
      in: query
      name: ns_project_id
      schema:
        type: string
    AEPParameter:
      in: query
      name: aep
      schema:
        type: string
    ExposureTypeParameter:
      in: query
      name: exposure_type
      schema:
        type: string
    CategoryParameter:
      in: query
      name: category
      schema:
        type: string
    VegetationCodeParameter:
      in: query
      name: vegetation_code
      schema:
        type: string
    StormIDParameter:
      in: query
      name: storm_id
      schema:
        type: string
    SSPParameter:
      in: query
      name: ssp
      schema:
        type: string
    MigrationParameter:
      in: query
      name: migration
      schema:
        type: string
  schemas:
    GetBaseTimeSeriesViewResponse:
      type: object
      properties:
        message:
          type: string
        success:
          type: boolean
    GetBaseTimeSeriesValueResponse:
      allOf:
        - $ref: '#/components/schemas/GetBaseTimeSeriesViewResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: number
              example: [
                ["elapsed_year", "model_group_name", "scenario_name", "geography", "value"],
                [2,"FWOA","Lower",309,10194.2584]
              ]
              description: This will be a list of list of values, where the first list is the header values and the subsequent items are data.
    GetBaseTimeSeriesValue105090Response:
      allOf:
        - $ref: '#/components/schemas/GetBaseTimeSeriesViewResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              example: [
                ["elapsed_year", "model_group_name", "scenario_name", "geography","value_10", "value_50", "value_90"],
                [2,"FWOA","Lower",309,10194.2584,940812.4823,1063475.361]
              ]
              description: This will be a list of list of values, where the first list is the header values and the subsequent items are data.
    GetBaseTimeSeriesValue055095Response:
      allOf:
        - $ref: '#/components/schemas/GetBaseTimeSeriesViewResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              example: [
                ["elapsed_year", "model_group_name", "scenario_name", "geography","value_05", "value_50", "value_95"],
                [2,"FWOA","Lower",309,10194.2584,940812.4823,1063475.361]
              ]
              description: This will be a list of list of values, where the first list is the header values and the subsequent items are data.
